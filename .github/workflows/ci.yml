name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Select toolchain
        run: rustup default 1.94.0
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --check
      - name: Typecheck
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Licences and pinned fonts
        run: |
          python3 scripts/check_licenses.py
          python3 scripts/check_fonts.py
      - name: Release and terminal probes
        run: cargo build --release --locked --examples --bin gridtop
      - name: Native terminal lifecycle
        run: |
          python3 scripts/pty_check.py
          python3 scripts/runner-native.py --lifecycle-only
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: RustSec lockfile audit
        run: cargo audit
  exports:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      # Match package-lock.json; the image supplies browsers and their OS libraries.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: JavaScript tooling
        run: npm ci
      - name: JavaScript dependency audit
        run: npm audit --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Python formatting
        run: |
          python3 -m venv .tmp/check-tools
          .tmp/check-tools/bin/pip install ruff==0.14.3
          .tmp/check-tools/bin/ruff format --check scripts
          .tmp/check-tools/bin/ruff check scripts
      - name: Browser runtime
        timeout-minutes: 10
        run: docker pull "$PLAYWRIGHT_IMAGE"
      - name: Generate offline exports
        run: |
          cargo run --locked --example runner-gallery
          cargo run --locked --example map-gallery
          cargo run --locked --example theme-gallery
      - name: Serial Chromium, WebKit and Firefox checks
        timeout-minutes: 10
        run: |
          docker run --rm --init --ipc=host --network none --env DEBUG=pw:browser \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/work" --workdir /work \
            "$PLAYWRIGHT_IMAGE" bash -euc '
              failed=0
              for engine in chromium webkit firefox; do
                npm run check:browser -- "$engine" || failed=1
              done
              exit "$failed"
            '
