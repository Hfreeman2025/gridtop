[package]
name = "gridtop"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Carbon-aware command scheduling and a live view of Great Britain's electricity grid"
license = "MIT"
authors = ["Harry Freeman"]
repository = "https://github.com/Hfreeman2025/gridtop"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ctrlc = { version = "3.5", features = ["termination"] }
nix = { version = "=0.31.3", features = ["signal", "process", "term"] }
signal-hook = "=0.3.18"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Keep transitive dependencies within the documented licence policy.
lru = "=0.12.4"
url = ">=2.5.4, <2.6"
unicode-normalization = "=0.1.24"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
unicode-ident = { path = "vendor/unicode-ident" }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
